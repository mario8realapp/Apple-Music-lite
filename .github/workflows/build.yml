name: Compilar y publicar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          mkdir -p project
          unzip -o MusicTVLite_v1.2_FIXED_GitHubReady.zip -d project

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Dar permisos a Gradle Wrapper
        working-directory: project/MusicTVLite_v1_2
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Compilar APK
        working-directory: project/MusicTVLite_v1_2
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Preparar APK
        run: |
          mkdir -p release
          cp project/MusicTVLite_v1_2/app/build/outputs/apk/debug/app-debug.apk release/MusicTVLite.apk

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2
          name: MusicTV Lite v1.2
          body: |
            MusicTV Lite v1.2

            - Navegación mejorada para Google TV
            - Elementos seleccionados más visibles
            - Animación de enfoque
            - Acceso/login mejorado
            - Mejor soporte para control remoto
            - Icono personalizado
          files: release/MusicTVLite.apk
          make_latest: true
