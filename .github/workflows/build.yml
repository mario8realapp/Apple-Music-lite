name: Compilar APK para Google TV

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          mkdir project
          unzip MusicTVLite_iPhone_FIXED.zip -d project

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: project
        run: gradle assembleDebug

      - name: Preparar APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk MusicTVLite.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicTVLite-APK
          path: MusicTVLite.apk
